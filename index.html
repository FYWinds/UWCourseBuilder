<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan a University of Waterloo Bachelor of Computer Science degree: requirements audit, must-take courses, and a term-by-term planner." />
    <title>UW Course Builder · BCS planner</title>
    <script>
      // Apply the stored theme before first paint to avoid a light flash.
      try {
        const mode = JSON.parse(localStorage.getItem('uwcb-theme') || '{}').state?.mode ?? 'system'
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
